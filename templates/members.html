{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="header-flex">
        <h2>Members List</h2>
    </div>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>PIN</th>
                    <th>Name</th>
                    <th>DOB</th>
                    <th>Sex</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for m in members %}
                <tr>
                    <td>{{ m.pin }}</td>
                    <td>{{ m.member_name }}</td>
                    <td>{{ m.date_of_birth }}</td>
                    <td>{{ m.sex }}</td>
                    <td>{{ m.member_type }}</td>
                    <td>
                        <a href="{{ url_for('member_detail', pin=m.pin) }}" class="btn btn-primary btn-small">View / Edit</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="card">
    <h2>Add New Member</h2>
    <form method="POST" action="{{ url_for('members') }}">
        <div class="form-grid">
            <div class="form-group"><label>Member Name</label><input type="text" name="member_name" required maxlength="40"></div>
            <div class="form-group"><label>DOB (YYYY-MM-DD)</label><input type="date" name="date_of_birth" required></div>
            <div class="form-group"><label>Place of Birth</label><input type="text" name="place_of_birth" required maxlength="50"></div>
            <div class="form-group">
                <label>Sex</label>
                <select name="sex" required>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Civil Status</label>
                <select name="civil_status" required>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Widower">Widower</option>
                    <option value="Annulled">Annulled</option>
                    <option value="Legally Separated">Legally Separated</option>
                </select>
            </div>
            <div class="form-group">
                <label>Citizenship</label>
                <select name="citizenship" required>
                    <option value="FILIPINO">FILIPINO</option>
                    <option value="FOREIGN NATIONAL">FOREIGN NATIONAL</option>
                    <option value="DUAL CITIZENSHIP">DUAL CITIZENSHIP</option>
                </select>
            </div>
            <div class="form-group"><label>Perm. Address</label><input type="text" name="permanent_address" required maxlength="70"></div>
            <div class="form-group"><label>Mailing Address</label><input type="text" name="mailing_address" maxlength="20" placeholder="Auto-derived if empty"></div>
            <div class="form-group"><label>Mobile No</label><input type="text" name="mobile_number" required maxlength="11"></div>
            <div class="form-group"><label>Home Phone</label><input type="text" name="home_phone_number" maxlength="50"></div>
            <div class="form-group"><label>Business Line</label><input type="text" name="bussiness_line" maxlength="50"></div>
            <div class="form-group"><label>Email</label><input type="email" name="email_address" required maxlength="20"></div>
            <div class="form-group"><label>Profession</label><input type="text" name="profession" maxlength="30"></div>
            <div class="form-group"><label>Monthly Income</label><input type="number" name="monthly_income" min="1"></div>
            <div class="form-group"><label>PhilSys ID</label><input type="text" name="philsys_id" maxlength="20"></div>
            <div class="form-group"><label>SRRV ID</label><input type="text" name="srrv_id" maxlength="15"></div>
            <div class="form-group"><label>ACR ID</label><input type="text" name="acr_id" maxlength="15"></div>
            <div class="form-group"><label>PWD ID</label><input type="text" name="pwd_id" maxlength="20"></div>
            <div class="form-group"><label>Mother Name</label><input type="text" name="mother_fullname" required maxlength="40"></div>
            <div class="form-group"><label>Spouse Name</label><input type="text" name="spouse_fullname" maxlength="40"></div>
            <div class="form-group">
                <label>Member Type</label>
                <select name="member_type" required>
                    {% for t in types %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Add Member</button>
        </div>
    </form>
</div>
{% endblock %}
