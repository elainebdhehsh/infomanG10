{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="header-flex">
        <h2>Edit Member: {{ member.pin }}</h2>
        <form method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this member and their dependents?');">
            <input type="hidden" name="_method" value="DELETE">
            <button type="submit" class="btn btn-danger">Delete Member</button>
        </form>
    </div>
    
    <form method="POST" action="{{ url_for('member_detail', pin=member.pin) }}">
        <div class="form-grid">
            <div class="form-group"><label>Member Name</label><input type="text" name="member_name" value="{{ member.member_name }}" required maxlength="40"></div>
            <div class="form-group"><label>DOB (YYYY-MM-DD)</label><input type="date" name="date_of_birth" value="{{ member.date_of_birth }}" required></div>
            <div class="form-group"><label>Place of Birth</label><input type="text" name="place_of_birth" value="{{ member.place_of_birth }}" required maxlength="50"></div>
            <div class="form-group">
                <label>Sex</label>
                <select name="sex" required>
                    <option value="M" {% if member.sex == 'M' %}selected{% endif %}>Male</option>
                    <option value="F" {% if member.sex == 'F' %}selected{% endif %}>Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Civil Status</label>
                <select name="civil_status" required>
                    {% for stat in ['Single', 'Married', 'Widower', 'Annulled', 'Legally Separated'] %}
                    <option value="{{ stat }}" {% if member.civil_status == stat %}selected{% endif %}>{{ stat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Citizenship</label>
                <select name="citizenship" required>
                    {% for cit in ['FILIPINO', 'FOREIGN NATIONAL', 'DUAL CITIZENSHIP'] %}
                    <option value="{{ cit }}" {% if member.citizenship == cit %}selected{% endif %}>{{ cit }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group"><label>Perm. Address</label><input type="text" name="permanent_address" value="{{ member.permanent_address }}" required maxlength="70"></div>
            <div class="form-group"><label>Mailing Address</label><input type="text" name="mailing_address" value="{{ member.mailing_address or '' }}" maxlength="20"></div>
            <div class="form-group"><label>Mobile No</label><input type="text" name="mobile_number" value="{{ member.mobile_number }}" required maxlength="11"></div>
            <div class="form-group"><label>Home Phone</label><input type="text" name="home_phone_number" value="{{ member.home_phone_number or '' }}" maxlength="50"></div>
            <div class="form-group"><label>Business Line</label><input type="text" name="bussiness_line" value="{{ member.bussiness_line or '' }}" maxlength="50"></div>
            <div class="form-group"><label>Email</label><input type="email" name="email_address" value="{{ member.email_address }}" required maxlength="20"></div>
            <div class="form-group"><label>Profession</label><input type="text" name="profession" value="{{ member.profession or '' }}" maxlength="30"></div>
            <div class="form-group"><label>Monthly Income</label><input type="number" name="monthly_income" value="{{ member.monthly_income or '' }}" min="1"></div>
            <div class="form-group"><label>PhilSys ID</label><input type="text" name="philsys_id" value="{{ member.philsys_id or '' }}" maxlength="20"></div>
            <div class="form-group"><label>SRRV ID</label><input type="text" name="srrv_id" value="{{ member.srrv_id or '' }}" maxlength="15"></div>
            <div class="form-group"><label>ACR ID</label><input type="text" name="acr_id" value="{{ member.acr_id or '' }}" maxlength="15"></div>
            <div class="form-group"><label>PWD ID</label><input type="text" name="pwd_id" value="{{ member.pwd_id or '' }}" maxlength="20"></div>
            <div class="form-group"><label>Mother Name</label><input type="text" name="mother_fullname" value="{{ member.mother_fullname }}" required maxlength="40"></div>
            <div class="form-group"><label>Spouse Name</label><input type="text" name="spouse_fullname" value="{{ member.spouse_fullname or '' }}" maxlength="40"></div>
            <div class="form-group">
                <label>Member Type</label>
                <select name="member_type" required>
                    {% for t in types %}
                    <option value="{{ t }}" {% if member.member_type == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Update Member</button>
            <a href="{{ url_for('members') }}" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
